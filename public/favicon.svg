<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Sharper gradients for 16px visibility -->
    <linearGradient id="glass-top-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3D4A" />
      <stop offset="100%" stop-color="#1A1C24" />
    </linearGradient>
    <linearGradient id="orange-pillar-fav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5D00" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
  </defs>

  <!-- Solid high-contrast background -->
  <rect width="512" height="512" rx="100" fill="#0A0B10" />

  <!-- Hardened Isometric Slab (Increased stroke for small sizes) -->
  <polygon points="256,120 420,200 256,280 92,200" fill="url(#glass-top-fav)" stroke="#4A4D5A" stroke-width="8"/>
  <polygon points="92,200 256,280 256,380 92,300" fill="#1A1C24" stroke="#2A2C34" stroke-width="8"/>
  <polygon points="256,280 420,200 420,300 256,380" fill="#0E0F14" stroke="#2A2C34" stroke-width="8"/>

  <!-- Thickened Beacon Pillar (No filters, solid core for tab brightness) -->
  <polygon points="256,40 290,150 290,440 256,490 222,440 222,150" fill="url(#orange-pillar-fav)" />
  <!-- High-Intensity Highlight core -->
  <rect x="246" y="80" width="20" height="360" rx="10" fill="#FFFFFF" opacity="0.9" />

  <!-- Enlarged Connectivity Nodes -->
  <circle cx="92" cy="200" r="28" fill="#39FF14" />
  <circle cx="420" cy="200" r="28" fill="#39FF14" />
  <!-- Solid dash for visibility -->
  <line x1="120" y1="200" x2="390" y2="200" stroke="#39FF14" stroke-width="12" stroke-dasharray="25 20" />
</svg>